[project]
name = "voicelaunch"
version = "0.1.0"
description = "A local, privacy-first Windows voice launcher."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "faster-whisper>=1.0", "sounddevice>=0.4.7", "numpy>=1.26", "rapidfuzz>=3.6", "keyboard>=0.13.5", "PyYAML>=6", "platformdirs>=4"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller>=6.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
